name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  test-and-verify:
    name: 1. Run Tests & Verify Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train Sentiment Model (Linux Environment)
        run: |
          python src/train_sentiment.py

      - name: Run Pytest Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: .
        run: |
          if [ -f "test_api.py" ] || [ -d "tests" ]; then
            pytest -v
          else
            echo "File pengujian tidak ditemukan, melompati unit test."
          fi

  publish-docker-image:
    name: 2. Publish Docker Image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-docs:
    name: 3. Deploy API Docs to GitHub Pages
    runs-on: ubuntu-latest
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate OpenAPI Spec & Static Web Page
        run: |
          mkdir public
          python -c "import json; from src.main import app; open('public/openapi.json', 'w').write(json.dumps(app.openapi()))"
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>API Documentation - Customer Feedback RAG</title>
            <meta charset="utf-8"/>
            <script src="https://cdn.redoc.ly/redoc/latest/bundles/redoc.standalone.js"></script>
          </head>
          <body>
            <div id="redoc-container"></div>
            <script>
              Redoc.init('openapi.json', {}, document.getElementById('redoc-container'));
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4