services:
  feedback-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer_feedback_rag_service
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./chroma_db_local:/app/chroma_db_local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3